<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: 'Segoe UI', 'Nirmala UI', sans-serif;
    background: linear-gradient(135deg, #eff6ff 0%, #ffffff 45%, #faf5ff 100%);
    color: #111827; padding: 50px 120px;
    display: grid; grid-template-columns: 470px 1fr; gap: 90px; align-items: center;
  }
  .phone { width: 450px; height: 940px; background: #111827; border-radius: 52px; padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .screen { background: white; border-radius: 40px; height: 100%; overflow: hidden; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; }
  .right { max-width: 1050px; }
  .kicker { font-size: 24px; font-weight: 700; color: #4f46e5; margin-bottom: 14px; }
  h1 { font-size: 52px; font-weight: 800; margin-bottom: 34px; line-height: 1.2; }
  .points { display: flex; flex-direction: column; gap: 20px; }
  .pt { display: flex; gap: 18px; align-items: flex-start; background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 22px 26px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .pt .ic { font-size: 32px; line-height: 1.2; }
  .pt .tx { font-size: 25px; color: #374151; line-height: 1.5; }
  .pt .tx b { color: #111827; }
</style>
</head>
<body>
  <div class="phone"><div class="screen"><img id="shot" src="" alt=""></div></div>
  <div class="right">
    <div class="kicker">Qwipo Buyer App — SalesBeat</div>
    <h1 id="title"></h1>
    <div class="points" id="points"></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("shot").src = "../buyer-app/" + q.get("img");
  if (q.get("pos")) document.getElementById("shot").style.objectPosition = "50% " + q.get("pos");
  document.getElementById("title").textContent = q.get("title") || "";
  const points = document.getElementById("points");
  for (let i = 1; i <= 4; i++) {
    const raw = q.get("b" + i);
    if (!raw) continue;
    const [ic, ...rest] = raw.split("|");
    const div = document.createElement("div");
    div.className = "pt";
    div.innerHTML = '<div class="ic">' + ic + '</div><div class="tx">' + rest.join("|") + "</div>";
    points.appendChild(div);
  }
</script>
</body>
</html>
