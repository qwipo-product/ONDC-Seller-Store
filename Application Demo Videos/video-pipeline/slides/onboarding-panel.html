<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    width: 1160px; height: 640px; overflow: hidden;
    font-family: 'Segoe UI', 'Nirmala UI', sans-serif;
    color: #111827;
  }
  .step { display: inline-flex; align-items: center; gap: 10px; background: #4f46e5; color: white; border-radius: 999px; padding: 8px 22px; font-size: 22px; font-weight: 700; margin-bottom: 18px; }
  h2 { font-size: 42px; font-weight: 800; margin-bottom: 26px; line-height: 1.25; }
  .points { display: flex; flex-direction: column; gap: 16px; }
  .pt { display: flex; gap: 16px; align-items: flex-start; background: rgba(255,255,255,0.92); border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .pt .ic { font-size: 28px; line-height: 1.2; }
  .pt .tx { font-size: 23px; color: #374151; line-height: 1.5; }
  .pt .tx b { color: #111827; }
</style>
</head>
<body>
  <div class="step" id="step"></div>
  <h2 id="title"></h2>
  <div class="points" id="points"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("step").textContent = q.get("step") || "";
  document.getElementById("title").textContent = q.get("title") || "";
  const points = document.getElementById("points");
  for (let i = 1; i <= 4; i++) {
    const raw = q.get("b" + i);
    if (!raw) continue;
    const [ic, ...rest] = raw.split("|");
    const div = document.createElement("div");
    div.className = "pt";
    div.innerHTML = '<div class="ic">' + ic + '</div><div class="tx">' + rest.join("|") + "</div>";
    points.appendChild(div);
  }
</script>
</body>
</html>
